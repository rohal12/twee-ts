name: Dependabot auto-merge

# Turns on auto-merge for Dependabot's grouped minor and patch updates and its grouped security updates
# (.github/dependabot.yml), so they merge once everything the main ruleset requires has passed, code scanning
# included. Major updates, and the release action (which is never grouped: a merge commit that names it requests a
# release), stay for a person.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  auto-merge:
    # The pull request's author, not whoever pushed last: only Dependabot's own pull requests
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write # merge the pull request
      pull-requests: write # turn on auto-merge
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # update-type is the largest update in the pull request
      - name: Turn on auto-merge
        if: >-
          steps.metadata.outputs.dependency-group != '' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch') &&
          !contains(steps.metadata.outputs.dependency-names, 'tobua/')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
