name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs get read access only; the coverage job widens it for its pull request comment.
permissions:
  contents: read

# A new push to a pull request cancels its older runs; pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check (strict, no warnings)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unused files, exports and dependencies
        run: pnpm run knip

  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22, 24]
        include:
          # The oldest Node that package.json "engines" allows.
          - os: ubuntu-latest
            node-version: 22.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      # tsdown itself needs Node 22.18+; the package's runtime on 22.12.0 is checked by the
      # package workflow's consumers job instead.
      - name: Build
        if: matrix.node-version != '22.12.0'
        run: pnpm run build

  # The compiler contract matrix (validation/contracts, docs/compiler-validation.md): public
  # behaviour checked against the build, imported as users import it.
  contracts:
    name: contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and run the contract cases
        run: pnpm run test:contracts

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the coverage report comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the job when a metric drops below the thresholds in vitest.config.ts.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          vite-config-path: vitest.config.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # Builds and packs the tarball, then checks it on every platform as users consume it.
  package:
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  # The bundler plugins against every Vite and Rollup the peer range allows: the plugin test files
  # (vitest.peer.config.ts aliases `vite` and `rollup` to the versions installed here; Vitest keeps
  # the repository's), and a consumer config type-checked against the packed plugins' types.
  plugin-peers:
    name: plugin peers (Vite ${{ matrix.vite }}, Rollup ${{ matrix.rollup }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { vite: 5.0.0, rollup: 4.0.0 }
          - { vite: '5.4', rollup: '4' }
          - { vite: 6.0.0, rollup: '4' }
          - { vite: '6', rollup: '4' }
          - { vite: 7.0.0, rollup: '4' }
          - { vite: '7', rollup: '4' }
          - { vite: 8.0.0, rollup: '4' }
          - { vite: '8', rollup: '4' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the peer versions
        env:
          VITE_VERSION: ${{ matrix.vite }}
          ROLLUP_VERSION: ${{ matrix.rollup }}
        run: |
          mkdir -p "$RUNNER_TEMP/peer"
          cd "$RUNNER_TEMP/peer"
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "vite@$VITE_VERSION" "rollup@$ROLLUP_VERSION"
          vite=$(node -p "require('./node_modules/vite/package.json').version")
          rollup=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "Vite $vite, Rollup $rollup" >> "$GITHUB_STEP_SUMMARY"

      - name: Plugin tests against the peer versions
        run: TWEE_TS_PEER_DIR="$RUNNER_TEMP/peer" pnpm exec vitest run --config vitest.peer.config.ts

      - name: Build and pack
        run: |
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP" --loglevel=error
          mv "$RUNNER_TEMP"/rohal12-twee-ts-*.tgz "$RUNNER_TEMP/package.tgz"

      - name: Type-check a consumer config against the peer versions
        run: |
          cd "$RUNNER_TEMP/peer"
          npm install --no-audit --no-fund "$RUNNER_TEMP/package.tgz" typescript@7.0.2 @types/node@22
          cat > consumer.ts <<'EOF'
          import { defineConfig } from 'vite';
          import type { Plugin as VitePlugin } from 'vite';
          import { defineConfig as defineRollupConfig } from 'rollup';
          import type { Plugin as RollupPlugin } from 'rollup';
          import { tweeTsPlugin } from '@rohal12/twee-ts/vite';
          import type { PluginCompileOptions, TweeTsVitePluginOptions } from '@rohal12/twee-ts/vite';
          import { tweeTsPlugin as tweeTsRollupPlugin } from '@rohal12/twee-ts/rollup';

          const compileOptions: PluginCompileOptions = { startPassage: 'Prologue', exclude: ['**/*.png'] };
          const options: TweeTsVitePluginOptions = { sources: ['src/story'], format: 'sugarcube-2', compileOptions };
          export const vitePlugin: VitePlugin = tweeTsPlugin(options);
          export default defineConfig(({ mode }) => ({
            plugins: [tweeTsPlugin({ ...options, compileOptions: { testMode: mode === 'development' } })],
          }));
          export const rollupPlugin: RollupPlugin = tweeTsRollupPlugin({ sources: ['src/story'] });
          export const rollupConfig = defineRollupConfig({
            input: 'src/main.js',
            plugins: [tweeTsRollupPlugin({ sources: ['src/story'] })],
          });
          // @ts-expect-error compileOptions.formatId is the plugin's format option
          tweeTsPlugin({ sources: ['src/story'], compileOptions: { formatId: 'harlowe-3' } });
          // @ts-expect-error compileOptions.sources is the plugin's sources option
          tweeTsRollupPlugin({ sources: ['src/story'], compileOptions: { sources: ['other'] } });
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "strict": true,
              "exactOptionalPropertyTypes": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "files": ["consumer.ts"]
          }
          EOF
          npx tsc -p tsconfig.json
