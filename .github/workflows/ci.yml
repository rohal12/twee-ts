name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Jobs get read access only; the coverage job widens it for its pull request comment.
permissions:
  contents: read

# A new push to a pull request cancels its older runs; pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check (strict, no warnings)
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unused files, exports and dependencies
        run: pnpm run knip

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  # The compiler contract matrix (validation/contracts, docs/compiler-validation.md): public
  # behaviour checked against the build, imported as users import it.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and run the contract cases
        run: pnpm run test:contracts

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the coverage report comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails the job when a metric drops below the thresholds in vitest.config.ts.
      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage report
        if: always() && github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        with:
          vite-config-path: vitest.config.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # The Vite plugin's entry tracking reads Vite's resolver and worker plugin, which the peer range (>=8) lets differ:
  # its tests also run against older Vite 8 release lines, besides the locked version every other job uses. 8.0 is
  # the oldest; 8.2 is the oldest whose `vite build --watch` reports a change inside a watched folder, so its build
  # watch cases (the resolution correction, letting go of a worker's bundle) run there, where 8.0 skips them.
  plugin-older-vite:
    name: plugin tests (Vite ${{ matrix.vite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite: ['8.0', '8.2']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vite ${{ matrix.vite }}
        env:
          VITE_LINE: ${{ matrix.vite }}
        # zizmor: ignore[adhoc-packages] the job tests an older Vite line than the lockfile's, on purpose
        run: |
          pnpm add -D "vite@~$VITE_LINE.0"
          echo "Vite $(node -p "require('vite/package.json').version")" >> "$GITHUB_STEP_SUMMARY"

      - name: Run the entry tracking tests
        run: pnpm exec vitest run test/vite-plugin-entry-links.test.ts test/vite-plugin-entry-worker.test.ts

  # Builds and packs the tarball, then checks it on every platform as users consume it.
  package:
    uses: ./.github/workflows/package.yml # zizmor: ignore[self-repository] the reusable workflow of this commit
    permissions:
      contents: read

  # A consumer config type-checked against the packed plugins' types, with the latest Vite and Rollup
  # installed the way a user installs them.
  plugin-peers:
    name: plugin peers (Vite 8, Rollup 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vite and Rollup
        env:
          VITE_VERSION: '8'
          ROLLUP_VERSION: '4'
        # zizmor: ignore[adhoc-packages] the latest Vite 8 and Rollup 4, installed as users install them, on purpose
        run: |
          mkdir -p "$RUNNER_TEMP/peer"
          cd "$RUNNER_TEMP/peer"
          echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-audit --no-fund "vite@$VITE_VERSION" "rollup@$ROLLUP_VERSION"
          vite=$(node -p "require('./node_modules/vite/package.json').version")
          rollup=$(node -p "require('./node_modules/rollup/package.json').version")
          echo "Vite $vite, Rollup $rollup" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and pack
        run: |
          pnpm run build
          npm pack --pack-destination "$RUNNER_TEMP" --loglevel=error
          mv "$RUNNER_TEMP"/rohal12-twee-ts-*.tgz "$RUNNER_TEMP/package.tgz"

      - name: Type-check a consumer config
        # zizmor: ignore[adhoc-packages] a consumer project that installs the packed tarball, on purpose
        run: |
          cd "$RUNNER_TEMP/peer"
          npm install --no-audit --no-fund "$RUNNER_TEMP/package.tgz" typescript@7.0.2 @types/node@22
          cat > consumer.ts <<'EOF'
          import { defineConfig } from 'vite';
          import type { Plugin as VitePlugin } from 'vite';
          import { defineConfig as defineRollupConfig } from 'rollup';
          import type { Plugin as RollupPlugin } from 'rollup';
          import { tweeTsPlugin } from '@rohal12/twee-ts/vite';
          import type { PluginCompileOptions, TweeTsVitePluginOptions } from '@rohal12/twee-ts/vite';
          import { tweeTsPlugin as tweeTsRollupPlugin } from '@rohal12/twee-ts/rollup';

          const compileOptions: PluginCompileOptions = { startPassage: 'Prologue', exclude: ['**/*.png'] };
          const options: TweeTsVitePluginOptions = { sources: ['src/story'], format: 'sugarcube-2', compileOptions };
          export const vitePlugin: VitePlugin = tweeTsPlugin(options);
          export default defineConfig(({ mode }) => ({
            plugins: [tweeTsPlugin({ ...options, compileOptions: { testMode: mode === 'development' } })],
          }));
          export const rollupPlugin: RollupPlugin = tweeTsRollupPlugin({ sources: ['src/story'] });
          export const rollupConfig = defineRollupConfig({
            input: 'src/main.js',
            plugins: [tweeTsRollupPlugin({ sources: ['src/story'] })],
          });
          // @ts-expect-error compileOptions.formatId is the plugin's format option
          tweeTsPlugin({ sources: ['src/story'], compileOptions: { formatId: 'harlowe-3' } });
          // @ts-expect-error compileOptions.sources is the plugin's sources option
          tweeTsRollupPlugin({ sources: ['src/story'], compileOptions: { sources: ['other'] } });
          EOF
          cat > tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "nodenext",
              "moduleResolution": "nodenext",
              "strict": true,
              "exactOptionalPropertyTypes": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "files": ["consumer.ts"]
          }
          EOF
          npx tsc -p tsconfig.json
