name: Dependencies

# GitHub's dependency graph reads only the first YAML document of pnpm-lock.yaml, which pnpm 12 fills with the pnpm
# version it pins, so it sees none of the npm packages. `snapshot` lists every package the lockfile installs
# (scripts/dependency-snapshot.ts) and `submit` sends them to the dependency submission API, so Dependabot alerts
# cover them. On a pull request, `dependency-review` then fails when the change adds a package version with a known
# vulnerability of moderate severity or higher, in any scope: parse5, entities and acorn are bundled into dist/.
# Dependency review compares the snapshots of the pull request's base and head commits. A base commit may have none
# (see `schedule` below), and every package would then count as added, so a pull request submits both.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dependabot's auto-merged pull requests are merged with a workflow token, and a push made with one starts no
  # workflow: the daily run brings the dependency graph up to date after them.
  schedule:
    - cron: '37 5 * * *'

permissions: {}

concurrency:
  group: dependencies-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check out the base commit
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base-commit
          persist-credentials: false

      - name: List the packages in the base commit's pnpm-lock.yaml
        if: github.event_name == 'pull_request'
        env:
          SNAPSHOT_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          pnpm --dir base-commit ls --lockfile-only --json --depth Infinity |
            node scripts/dependency-snapshot.ts > "$RUNNER_TEMP/snapshots/base.json"

      # Reads the lockfile only: nothing is installed.
      - name: List the packages in pnpm-lock.yaml
        env:
          # A pull request's snapshot is of its head commit, which dependency review compares
          SNAPSHOT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/snapshots"
          pnpm ls --lockfile-only --json --depth Infinity |
            node scripts/dependency-snapshot.ts > "$RUNNER_TEMP/snapshots/head.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error
          retention-days: 1

  submit:
    needs: snapshot
    # A pull request from a fork gets a token that cannot submit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # The dependency submission API needs it. The job checks out nothing and runs no repository code: it sends
      # the snapshots the read-only job wrote.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-snapshot
          path: ${{ runner.temp }}/snapshot

      - name: Submit the snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The base commit's goes first, so that the head commit's is the latest for this ref. It carries the pull
          # request's ref, not the base branch's, so it leaves the dependency graph of the default branch alone.
          if [ -f "$RUNNER_TEMP/snapshot/base.json" ]; then
            gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot/base.json"
          fi
          gh api "repos/$GITHUB_REPOSITORY/dependency-graph/snapshots" --input "$RUNNER_TEMP/snapshot/head.json"

  dependency-review:
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    needs: submit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The action's allow list has no expiry, so this step leaves an advisory out of it after its date. The reason
      # for each advisory is in osv-scanner.toml, which has the same advisories and dates for Scorecard.
      - name: List the advisories allowed today
        id: allowed
        run: |
          if [[ "$(date -u +%F)" < 2027-02-07 ]]; then
            echo 'ghsas=GHSA-g3hv-75wg-m249' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          allow-ghsas: ${{ steps.allowed.outputs.ghsas }}
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          # Waits until GitHub has processed the snapshot `submit` sent
          retry-on-snapshot-warnings: true
