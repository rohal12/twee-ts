name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Each job asks for what it needs. Only the release job, which installs nothing and runs no
# package scripts, may push tags and publish.
permissions: {}

# Two quick merges must not run semantic-release at the same time and race on tags. A running
# release always finishes; a newer push replaces a release run that is still waiting.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

  # Builds, packs and checks the tarball (all platforms) and uploads it as the "package" artifact.
  package:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/package.yml
    permissions:
      contents: read

  release:
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write # git tag and GitHub release
      id-token: write # npm trusted publishing (OIDC); there is no npm token
    steps:
      # semantic-release reads the commit history and the release annotation in the head commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # npm publishes through trusted publishing (OIDC) only from npm 11.5.1 on; Node 22 ships npm 10.
          node-version: 24

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack

      # Publish exactly the tarball the package job checked. semantic-release writes the release
      # version into this folder's package.json (git keeps 0.0.0-development), which is where the
      # CLI and creator-version read it at runtime.
      - name: Unpack the checked tarball
        run: |
          mkdir -p "$RUNNER_TEMP/release-package"
          tar -xzf "$RUNNER_TEMP/pack/package.tgz" -C "$RUNNER_TEMP/release-package" --strip-components=1

      - name: Release to npm
        uses: tobua/release-npm-action@1385c0505227edf9f4d21e619044e785d97ea104 # v5.0.5
        env:
          # npm runs no lifecycle scripts while versioning and publishing the unpacked tarball.
          npm_config_ignore_scripts: 'true'
        with:
          FOLDER: ${{ runner.temp }}/release-package
          # The release trigger matches anywhere in the commit message, including inside this
          # action's name. When it fires with only chore/docs commits to release, pass instead of failing.
          FAIL_ON_SKIP: 'false'
