name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # npm publishes through trusted publishing (OIDC) only from npm 11.5.1 on; Node 22 ships npm 10.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      # Publishes through npm trusted publishing (OIDC, id-token: write above); no npm token.
      - name: Release to npm
        uses: tobua/release-npm-action@v5
        with:
          # The release trigger matches anywhere in the commit message, including inside this
          # action's name. When it fires with only chore/docs commits to release, pass instead of failing.
          FAIL_ON_SKIP: 'false'
