name: Scorecard

# OpenSSF Scorecard: rates the repository's supply-chain practices, uploads the findings to code scanning and
# publishes the results to api.scorecard.dev. The Scorecard API accepts results only from a workflow that keeps to
# its restrictions (https://github.com/ossf/scorecard-action#workflow-restrictions): no workflow-level env or
# write permissions, and only the listed actions in this job.
on:
  # The Branch-Protection check
  branch_protection_rule:
  # The Maintained check
  schedule:
    - cron: '41 4 * * 1'
  push:
    branches: [main]

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analysis:
    runs-on: ubuntu-latest
    # Scorecard only supports the default branch.
    if: github.event.repository.default_branch == github.ref_name
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to api.scorecard.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: results.sarif
