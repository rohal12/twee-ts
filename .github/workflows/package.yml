name: Package

# Builds and packs the npm tarball, then checks it the way users consume it. Called by CI (every
# pull request and push) and by the release workflow, which publishes the tarball checked here.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # The build regenerates THIRD_PARTY_NOTICES from the packages it bundled.
      - name: THIRD_PARTY_NOTICES is current
        run: |
          if [ -n "$(git status --porcelain -- THIRD_PARTY_NOTICES)" ]; then
            git diff -- THIRD_PARTY_NOTICES
            echo "::error file=THIRD_PARTY_NOTICES::THIRD_PARTY_NOTICES is out of date. Run pnpm run build and commit it."
            exit 1
          fi

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --pack-destination "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP"/pack/*.tgz "$RUNNER_TEMP/pack/package.tgz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack/package.tgz
          if-no-files-found: error

  consumers:
    name: consumers (${{ matrix.os }}, Node ${{ matrix.node-version }})
    needs: pack
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [24]
        include:
          - os: ubuntu-latest
            node-version: 22
          # The oldest Node that package.json "engines" allows.
          - os: ubuntu-latest
            node-version: 22.12.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pack

      # publint --strict, Are the Types Wrong, TypeScript consumers (nodenext, node16 CJS, bundler,
      # node10; exactOptionalPropertyTypes on and off), ESM and CJS runtime, the CLI through npx.
      - name: Check the package
        run: node scripts/check-package.mjs "${{ runner.temp }}/pack/package.tgz"
