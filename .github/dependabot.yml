# Version and security updates for every package ecosystem in the repository: the pnpm workspace at the root
# (package.json, pnpm-lock.yaml) and the GitHub Actions in .github/workflows, pinned to commit SHAs.
#
# Dependency bumps are chores (Conventional Commits), so they never decide a release version.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A week for a bad release to be found and pulled; also longer than pnpm's minimumReleaseAge (a day), so pnpm
    # installs every version Dependabot proposes. Security updates do not wait.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # Released together, and their versions must match: one pull request, majors included.
      vitest:
        patterns: ['vitest', '@vitest/coverage-*']
      # Released together; patches/ holds a patch for one exact version of the vitest runner, so a bump of this
      # group also updates the patch (pnpm-workspace.yaml, patchedDependencies).
      stryker:
        patterns: ['@stryker-mutator/*']
      # Dependabot prefers a group with update-types over one with only patterns, so the packages of the groups
      # above are left out here.
      npm-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns: ['vitest', '@vitest/coverage-*', '@stryker-mutator/*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
    groups:
      # The release action stays in a pull request of its own: the commit that merges a pull request naming it
      # requests a release (CLAUDE.md, "Releasing").
      actions-minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
        exclude-patterns: ['tobua/*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
        exclude-patterns: ['tobua/*']
